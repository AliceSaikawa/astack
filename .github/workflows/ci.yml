name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TLA2TOOLS: ${{ github.workspace }}/.tools/tla2tools.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache tla2tools.jar
        id: tla2tools-cache
        uses: actions/cache@v4
        with:
          path: .tools/tla2tools.jar
          key: tla2tools-1.7.4-sha256-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

      - name: Install TLA+ tools (tla2tools.jar 1.7.4)
        run: node scripts/setup-tla2tools.mjs

      - name: Install root dependencies
        run: npm ci

      - name: Install statechart script dependencies
        run: npm ci
        working-directory: skills/statechart/scripts

      - name: Install poteto-mode script dependencies
        run: bun install --frozen-lockfile
        working-directory: skills/poteto-mode/scripts

      - name: Run all checks
        run: npm run check