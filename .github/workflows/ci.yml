name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm ci

      - name: Install statechart script dependencies
        run: npm ci
        working-directory: skills/statechart/scripts

      - name: Install poteto-mode script dependencies
        run: bun install --frozen-lockfile
        working-directory: skills/poteto-mode/scripts

      - name: Run all checks
        run: npm run check